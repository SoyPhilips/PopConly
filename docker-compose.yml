# PopConly en Oracle Cloud Free Tier (VM Ampere A1: 4 OCPU / 24 GB RAM)
# Las 4 bases corren en Docker en la misma VM. Todo cabe en el free tier.
# Las imágenes oficiales tienen soporte ARM64.

services:
  # Módulo 1: Autenticación y Cuentas
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-popconly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: popconly_auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-popconly} -d popconly_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Módulo 2: Catálogo (películas, series, categorías, actores, URLs de video)
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-popconly}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?define MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: popconly_catalog
    volumes:
      - mongodata:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME:-popconly}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD:?define MONGO_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Módulo 3: Historial, minuto exacto y favoritos (caché rápida)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?define REDIS_PASSWORD}", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?define REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Módulo 4: Suscripciones y Pagos (membresías y fechas de corte)
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: popconly_billing
      MYSQL_USER: ${MYSQL_USER:-popconly}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?define MYSQL_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # App Next.js (se construye desde este repo)
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    # Todo el .env local (AUTH_SECRET, SMTP_*, YOUTUBE_API_KEY, NEXT_PUBLIC_*...).
    # Lo explícito de abajo manda (hosts internos). En Oracle define MEDIA_DIR
    # y monta el volumen de carátulas: - /opt/popconly/media:/opt/popconly/media:ro
    env_file:
      - path: .env
        required: false
    environment:
      # El standalone escucha en el hostname del contenedor si no se fija:
      # con 0.0.0.0 acepta también loopback (healthcheck) y la red Docker.
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-popconly}:${POSTGRES_PASSWORD}@postgres:5432/popconly_auth
      MONGODB_URI: mongodb://${MONGO_USER:-popconly}:${MONGO_PASSWORD}@mongo:27017/popconly_catalog?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MYSQL_URL: mysql://${MYSQL_USER:-popconly}:${MYSQL_PASSWORD}@mysql:3306/popconly_billing
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY:-}
      WOMPI_EVENTS_SECRET: ${WOMPI_EVENTS_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/titles?slug=fallout').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  pgdata:
  mongodata:
  redisdata:
  mysqldata:
